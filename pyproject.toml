[project]
name = "fund-data-integrated-platform"
version = "0.1.0"
description = "A Tkinter desktop platform for fund crawling, scoring, visualization, comparison, market flow, and portfolio tracking."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Fund Data Integrated Platform Contributors" }
]
keywords = ["fund", "finance", "tkinter", "visualization", "portfolio", "china-market"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "akshare>=1.15.0",
  "flask>=3.0.0",
  "lxml>=5.0.0",
  "matplotlib>=3.7.0",
  "numpy>=1.24.0",
  "openpyxl>=3.1.0",
  "pandas>=2.0.0",
  "requests>=2.31.0",
  "schedule>=1.2.0",
]

